[workspace]
members = [
    "crates/core",
    "crates/processing",
    "crates/export",
    "crates/adapters",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
