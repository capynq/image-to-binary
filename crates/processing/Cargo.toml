[package]
name = "image-to-binary-processing"
version = "0.1.0"
description = "Processing job lifecycle contracts"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
heif = ["dep:libheif-rs"]

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
gif = { version = "=0.14.2", default-features = false, features = ["std"] }
image-to-binary-core = { path = "../core" }
fontdue = "=0.9.4"
libheif-rs = { version = "=3.0.0", optional = true }

[dev-dependencies]
tiff = "=0.11.3"
image-to-binary-adapters = { path = "../adapters" }
image-to-binary-export = { path = "../export" }
png = "=0.18.1"

[lints]
workspace = true

[[example]]
name = "browser_matrix_reference"
path = "examples/browser_matrix_reference.rs"

[[example]]
name = "heif_reference"
path = "examples/heif_reference.rs"
required-features = ["heif"]
