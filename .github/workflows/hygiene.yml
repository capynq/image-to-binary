name: Repository hygiene

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Ignore rules, tracked sources and clean worktree
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Assert generated outputs are git-ignored
        run: |
          set -euo pipefail
          for path in \
            docs/reports/example.txt \
            .local/notices/THIRD_PARTY_LICENSES.txt \
            .local/packages/macos-arm64/example.app \
            frontend/dist/index.html \
            frontend/node_modules/example \
            target/debug/example \
            crates/desktop/target/debug/example \
            crates/desktop/gen/schemas/example.json \
            crates/desktop/permissions/autogenerated/example.toml; do
            git check-ignore -q "$path" || { echo "not ignored: $path" >&2; exit 1; }
          done
      - name: Assert source fixtures, notices and lockfiles are tracked
        run: |
          set -euo pipefail
          for path in \
            LICENSE \
            THIRD_PARTY_NOTICES.md \
            assets/fonts/OFL.txt \
            tools/package/generate-notices.sh \
            tools/package/licenses/MIT.txt \
            tools/package/licenses/Apache-2.0.txt \
            tools/package/licenses/BSD-3-Clause.txt \
            tools/package/licenses/MPL-2.0.txt \
            tools/package/licenses/Zlib.txt \
            crates/processing/tests/fixtures/heif/PROVENANCE.md \
            crates/processing/tests/fixtures/heif/sample.heic \
            Cargo.lock \
            crates/desktop/Cargo.lock \
            frontend/package-lock.json; do
            git ls-files --error-unmatch -- "$path" >/dev/null || { echo "not tracked: $path" >&2; exit 1; }
          done
      - name: Initialize declared Rust toolchain
        run: rustup show
      - name: Add WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Set up Node.js from the frontend pin
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore pinned wasm-bindgen tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .local/wasm-tools
          key: wasm-tools-${{ runner.os }}-${{ hashFiles('crates/wasm/Cargo.toml') }}
      - name: Install pinned wasm-bindgen CLI
        run: node crates/wasm/scripts/setup.mjs
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend and WASM package
        working-directory: frontend
        run: npm run build
      - name: Assert the worktree is clean after builds
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            echo "build outputs leaked into the worktree:" >&2
            echo "$dirty" >&2
            exit 1
          fi
